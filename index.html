<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rickroll Shield ULTRA + 3 Modes</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --safe: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --primary: #3b82f6;
            --editor: #7c3aed;
            --text-mode: #ec4899;
            --youtube: #ff0000;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px 0;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 25px 20px;
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
            border-radius: 20px;
            border: 2px solid #334155;
        }
        h1 {
            font-size: 2.5rem;
            margin: 10px 0;
            color: #60a5fa;
        }
        .version-badge {
            background: var(--youtube);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        /* MODE TOGGLES */
        .mode-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .mode-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 40px;
            background: #334155;
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            min-width: 120px;
        }
        .mode-btn.active[data-mode="standard"] {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .mode-btn.active[data-mode="advanced"] {
            background: var(--text-mode);
            color: white;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
        }
        .mode-btn.active[data-mode="youtube"] {
            background: var(--youtube);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 0, 0, 0.4);
        }
        .mode-description {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 10px;
            min-height: 40px;
        }
        
        .main-card {
            background: var(--card);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            border: 2px solid #334155;
            transition: all 0.3s;
        }
        .main-card.youtube-active {
            border-color: var(--youtube);
            border-width: 3px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input, textarea {
            padding: 18px;
            border-radius: 12px;
            border: 2px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 1.1rem;
        }
        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            min-width: 120px;
        }
        .primary-btn { background: var(--primary); color: white; }
        .primary-btn:hover { background: #2563eb; }
        .text-mode-btn { background: var(--text-mode); color: white; }
        .text-mode-btn:hover { background: #db2777; }
        .youtube-btn { background: var(--youtube); color: white; }
        .youtube-btn:hover { background: #dc2626; }
        .secondary-btn { background: #475569; color: white; }
        .danger-btn { background: var(--danger); color: white; }
        
        .result-box {
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            display: none;
            animation: fadeIn 0.5s;
            margin-top: 20px;
        }
        .safe { background: var(--safe); color: white; }
        .danger { background: var(--danger); color: white; animation: pulse 0.5s; }
        .warning { background: var(--warning); color: black; }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .stat-box {
            text-align: center;
            padding: 10px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 10px;
            min-width: 100px;
        }
        .stat-value {
            display: block;
            font-size: 1.8rem;
            font-weight: bold;
        }
        
        .history-section { margin-top: 40px; }
        .history-item {
            background: rgba(30, 41, 59, 0.5);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            border-left: 5px solid #475569;
            font-family: monospace;
        }
        .history-safe { border-left-color: var(--safe); }
        .history-danger { border-left-color: var(--danger); }
        .history-youtube { border-left-color: var(--youtube); }
        
        .floating-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--editor);
            color: white;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: var(--safe);
            color: white;
            border-radius: 10px;
            display: none;
            z-index: 2000;
        }
        .editor-section { display: none; }
        .editor-textarea {
            width: 100%;
            height: 200px;
            background: #0f172a;
            color: #86efac;
            border: 2px solid #475569;
            border-radius: 10px;
            padding: 15px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="notification" id="notification"></div>
    <button class="floating-btn" onclick="toggleEditor()">✏️</button>
    
    <div class="container">
        <header>
            <div class="version-badge">3 MODES</div>
            <h1>🛡️ Rickroll Shield ULTRA</h1>
            <p class="subtitle">Standard • Avansert • YouTube Mode</p>
        </header>
        
        <!-- MODE SELECTOR - ALLE TRE! -->
        <div class="mode-container">
            <button class="mode-btn active" data-mode="standard">🛡️ Standard</button>
            <button class="mode-btn" data-mode="advanced">⚡ Avansert</button>
            <button class="mode-btn" data-mode="youtube">🎥 YouTube</button>
        </div>
        <div class="mode-description" id="modeDesc">
            Standard: Sjekker kun lenker. Raskt og enkelt.
        </div>
        
        <!-- MAIN CARD -->
        <div class="main-card" id="mainCard">
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="Lim inn lenke eller YouTube-URL...">
                <div class="button-group">
                    <button id="checkBtn" class="primary-btn">🔍 Sjekk</button>
                    <button id="testBtn" class="secondary-btn">🎯 Test</button>
                    <button id="clearBtn" class="danger-btn">🗑️ Tøm historikk</button>
                </div>
            </div>
            
            <div id="resultBox" class="result-box">
                <span id="resultEmoji" class="emoji-large">🤔</span>
                <div id="resultText">Resultat vises her</div>
                <div id="resultDetail" style="margin-top: 10px;"></div>
            </div>
            
            <div class="stats">
                <div class="stat-box">
                    Totalt<br><span class="stat-value" id="totalChecks">0</span>
                </div>
                <div class="stat-box">
                    Rickrolls<br><span class="stat-value" id="rickrollCount">0</span>
                </div>
                <div class="stat-box">
                    Mønstre<br><span class="stat-value" id="patternCount">0</span>
                </div>
            </div>
        </div>
        
        <!-- TEXT ANALYSIS SECTION (Kun i Avansert modus) -->
        <div class="main-card" id="textSection" style="display: none;">
            <h3>🔤 Tekstanalyse</h3>
            <textarea id="textInput" rows="4" placeholder="Lim inn tekst for analyse..."></textarea>
            <div class="button-group" style="margin-top: 15px;">
                <button id="checkTextBtn" class="text-mode-btn">🔤 Analyser tekst</button>
                <button id="clearTextBtn" class="secondary-btn">🗑️ Tøm tekst</button>
            </div>
            <div id="textResultBox" class="result-box" style="display: none;"></div>
        </div>
        
        <!-- HISTORY -->
        <div class="main-card">
            <h2>📜 Sjekkhistorikk</h2>
            <div id="historyList"></div>
            <p id="emptyHistory" style="text-align: center; opacity: 0.7;">Ingen sjekker utført ennå</p>
        </div>
        
        <!-- EDITOR -->
        <div class="main-card editor-section" id="editorSection">
            <h2>⚙️ Rediger Rickroll-database</h2>
            <textarea id="databaseEditor" class="editor-textarea" placeholder="Én per linje..."></textarea>
            <div class="editor-controls" style="display: flex; gap: 10px; margin-top: 15px;">
                <button onclick="saveDatabase()" class="primary-btn">💾 Lagre</button>
                <button onclick="resetToDefault()" class="danger-btn">🔄 Reset</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // DATABASE
        // ============================================
        const DEFAULT_DATABASE = [
            "youtube.com/watch?v=dQw4w9WgXcQ",
            "youtu.be/dQw4w9WgXcQ",
            "bit.ly/3t0x1mz",
            "tinyurl.com/rickroll",
            "rickroll.it",
            "nevergonnagiveyouup.com",
            "rickastley.co.uk"
        ];

        const TEXT_KEYWORDS = [
            { word: 'rickroll', confidence: 80 },
            { word: 'rick astley', confidence: 85 },
            { word: 'never gonna give you up', confidence: 90 },
            { word: 'never gonna let you down', confidence: 85 },
            { word: 'dqw4w9wgxcq', confidence: 100 }
        ];

        // State
        let rickrollDatabase = [...DEFAULT_DATABASE];
        let checkHistory = [];
        let totalChecks = 0;
        let rickrollsFound = 0;
        let currentMode = 'standard';

        // DOM elements
        const elements = {
            urlInput: document.getElementById('urlInput'),
            checkBtn: document.getElementById('checkBtn'),
            testBtn: document.getElementById('testBtn'),
            clearBtn: document.getElementById('clearBtn'),
            resultBox: document.getElementById('resultBox'),
            resultEmoji: document.getElementById('resultEmoji'),
            resultText: document.getElementById('resultText'),
            resultDetail: document.getElementById('resultDetail'),
            totalChecks: document.getElementById('totalChecks'),
            rickrollCount: document.getElementById('rickrollCount'),
            patternCount: document.getElementById('patternCount'),
            historyList: document.getElementById('historyList'),
            emptyHistory: document.getElementById('emptyHistory'),
            modeDesc: document.getElementById('modeDesc'),
            textSection: document.getElementById('textSection'),
            textInput: document.getElementById('textInput'),
            checkTextBtn: document.getElementById('checkTextBtn'),
            clearTextBtn: document.getElementById('clearTextBtn'),
            textResultBox: document.getElementById('textResultBox'),
            mainCard: document.getElementById('mainCard'),
            notification: document.getElementById('notification')
        };

        // ============================================
        // MODE SELECTOR - ALLE TRE!
        // ============================================
        function setMode(mode) {
            currentMode = mode;
            
            // Oppdater knapper
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            
            // Oppdater beskrivelse og UI
            if (mode === 'standard') {
                elements.modeDesc.textContent = 'Standard: Sjekker kun lenker. Raskt og enkelt.';
                elements.textSection.style.display = 'none';
                elements.mainCard.classList.remove('youtube-active');
                elements.urlInput.placeholder = 'Lim inn mistenkelig lenke...';
            }
            else if (mode === 'advanced') {
                elements.modeDesc.textContent = 'Avansert: Sjekker både lenker og tekst. Fang skjulte Rickrolls!';
                elements.textSection.style.display = 'block';
                elements.mainCard.classList.remove('youtube-active');
                elements.urlInput.placeholder = 'Lim inn lenke eller tekst...';
            }
            else if (mode === 'youtube') {
                elements.modeDesc.textContent = 'YouTube Mode: Lim inn YouTube-lenke for å scanne videoer!';
                elements.textSection.style.display = 'none';
                elements.mainCard.classList.add('youtube-active');
                elements.urlInput.placeholder = 'Lim inn YouTube URL...';
            }
        }

        // ============================================
        // YOUTUBE SCANNING
        // ============================================
        function scanYouTubeVideo(url) {
            showNotification('🎥 Scanner YouTube...', 'primary');
            
            // Hent video-ID
            let videoId = url;
            if (url.includes('v=')) {
                videoId = url.split('v=')[1].split('&')[0];
            } else if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            }
            
            // Sjekk video-ID
            if (videoId === 'dQw4w9WgXcQ') {
                displayResult(url, {
                    isRickroll: true,
                    type: '🎥 YOUTUBE RICKROLL',
                    matched: 'Klassisk Rickroll video-ID!',
                    confidence: 100
                });
                return;
            }
            
            // Sjekk om vi er på YouTube-siden
            if (window.location.hostname.includes('youtube.com')) {
                setTimeout(() => {
                    let details = [];
                    const title = document.querySelector('h1 yt-formatted-string');
                    if (title && title.textContent.toLowerCase().includes('rick astley')) {
                        details.push('🎬 Tittel: Rick Astley');
                    }
                    
                    if (details.length > 0) {
                        displayResult(url, {
                            isRickroll: true,
                            type: 'YOUTUBE FUNN',
                            matched: details.join('<br>'),
                            confidence: 85
                        });
                    } else {
                        displayResult(url, {
                            isRickroll: false,
                            type: 'YOUTUBE SCAN',
                            matched: 'Ingen Rickroll funnet på siden',
                            confidence: 100
                        });
                    }
                }, 2000);
            } else {
                displayResult(url, {
                    isRickroll: false,
                    type: 'VIDEO-ID SJEKK',
                    matched: 'Video-ID er ikke i databasen',
                    confidence: 100
                });
            }
        }

        // ============================================
        // KJERNEFUNKSJONER
        // ============================================
        function normalizeUrl(url) {
            return url.toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').split('?')[0];
        }

        function checkForRickroll(url) {
            const normalized = normalizeUrl(url);
            
            if (normalized.includes('dqw4w9wgxcq')) {
                return { isRickroll: true, matched: 'Rickroll video-ID', confidence: 100 };
            }
            
            for (const pattern of rickrollDatabase) {
                if (normalized.includes(pattern.toLowerCase())) {
                    return { isRickroll: true, matched: pattern, confidence: 95 };
                }
            }
            
            return { isRickroll: false };
        }

        function analyzeText(text) {
            const results = [];
            const lowerText = text.toLowerCase();
            
            TEXT_KEYWORDS.forEach(k => {
                if (lowerText.includes(k.word)) {
                    results.push({ type: 'KEYWORD', message: k.word, confidence: k.confidence });
                }
            });
            
            const urls = text.match(/(?:https?:\/\/)?(?:www\.)?[a-zA-Z0-9-]+\.[a-zA-Z]{2,}(?:\/\S*)?/gi) || [];
            urls.forEach(url => {
                const result = checkForRickroll(url);
                if (result.isRickroll) {
                    results.push({ type: 'HIDDEN_URL', message: 'Skjult Rickroll-lenke', confidence: 95 });
                }
            });
            
            return results;
        }

        function performCheck() {
            const input = elements.urlInput.value.trim();
            if (!input) {
                showNotification('Skriv inn noe!', 'warning');
                return;
            }
            
            // YOUTUBE MODE
            if (currentMode === 'youtube') {
                if (input.includes('youtube.com') || input.includes('youtu.be')) {
                    scanYouTubeVideo(input);
                } else {
                    showNotification('❌ YouTube Mode krever YouTube-lenke!', 'warning');
                }
                return;
            }
            
            // STANDARD MODE
            if (currentMode === 'standard') {
                const result = checkForRickroll(input);
                displayResult(input, result);
            }
            
            // AVANSERT MODE (beholder tekstanalyse)
            if (currentMode === 'advanced') {
                const result = checkForRickroll(input);
                displayResult(input, result);
            }
        }

        function performTextCheck() {
            const text = elements.textInput.value.trim();
            if (!text) {
                showNotification('Skriv inn tekst!', 'warning');
                return;
            }
            
            const results = analyzeText(text);
            
            if (results.length === 0) {
                elements.textResultBox.style.display = 'block';
                elements.textResultBox.className = 'result-box safe';
                elements.textResultBox.innerHTML = '✅ Ingen Rickrolls funnet i teksten';
            } else {
                elements.textResultBox.style.display = 'block';
                elements.textResultBox.className = 'result-box warning';
                let html = '⚠️ Mistenkelige funn:<br>';
                results.forEach(r => html += `• ${r.type}: ${r.message} (${r.confidence}%)<br>`);
                elements.textResultBox.innerHTML = html;
            }
        }

        function displayResult(input, result) {
            elements.resultBox.style.display = 'block';
            
            let emoji = '🤔', text = 'Ukjent', cssClass = 'warning', detail = '';
            
            if (result.isRickroll === true) {
                emoji = '🚨';
                text = 'RICKROLL FUNNET!';
                cssClass = 'danger';
                detail = result.matched + ' | ' + result.confidence + '%';
                rickrollsFound++;
            } else {
                emoji = '✅';
                text = 'SER TRYGG UT';
                cssClass = 'safe';
                detail = result.matched || 'Ingen Rickroll funnet';
            }
            
            elements.resultEmoji.textContent = emoji;
            elements.resultText.textContent = text;
            elements.resultDetail.innerHTML = detail;
            elements.resultBox.className = `result-box ${cssClass}`;
            
            totalChecks++;
            updateUI();
            addToHistory(input, result, new Date().toLocaleTimeString(), emoji);
        }

        function addToHistory(url, result, time, emoji) {
            const bgClass = result.isRickroll ? 'history-danger' : 
                           currentMode === 'youtube' ? 'history-youtube' : 'history-safe';
            
            const item = { id: Date.now(), url: url.substring(0, 50), time, emoji, bgClass };
            checkHistory.unshift(item);
            if (checkHistory.length > 10) checkHistory.pop();
            updateHistory();
        }

        function updateHistory() {
            elements.historyList.innerHTML = '';
            if (checkHistory.length === 0) {
                elements.emptyHistory.style.display = 'block';
                return;
            }
            elements.emptyHistory.style.display = 'none';
            checkHistory.forEach(item => {
                const div = document.createElement('div');
                div.className = `history-item ${item.bgClass}`;
                div.innerHTML = `<span>${item.emoji} ${item.time}</span> ${item.url}`;
                elements.historyList.appendChild(div);
            });
        }

        function updateUI() {
            elements.totalChecks.textContent = totalChecks;
            elements.rickrollCount.textContent = rickrollsFound;
            elements.patternCount.textContent = rickrollDatabase.length;
        }

        function showNotification(msg, type) {
            elements.notification.textContent = msg;
            elements.notification.style.background = type === 'danger' ? '#ef4444' : 
                                                     type === 'warning' ? '#f59e0b' : 
                                                     type === 'primary' ? '#3b82f6' : '#10b981';
            elements.notification.style.display = 'block';
            setTimeout(() => elements.notification.style.display = 'none', 3000);
        }

        function testRandomRickroll() {
            const testUrls = [
                'https://youtu.be/dQw4w9WgXcQ',
                'https://bit.ly/3t0x1mz',
                'https://rickroll.it'
            ];
            elements.urlInput.value = testUrls[Math.floor(Math.random() * testUrls.length)];
            performCheck();
        }

        function clearHistory() {
            if (confirm('Tømme historikk?')) {
                checkHistory = [];
                updateHistory();
                showNotification('Historikk tømt!', 'warning');
            }
        }

        function toggleEditor() {
            const editor = document.getElementById('editorSection');
            editor.style.display = editor.style.display === 'none' ? 'block' : 'none';
            if (editor.style.display === 'block') {
                document.getElementById('databaseEditor').value = rickrollDatabase.join('\n');
            }
        }

        function saveDatabase() {
            const text = document.getElementById('databaseEditor').value.trim();
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length > 0) {
                rickrollDatabase = [...new Set(lines)];
                updateUI();
                showNotification(`Database lagret (${rickrollDatabase.length} mønstre)!`, 'success');
            }
        }

        function resetToDefault() {
            if (confirm('Tilbakestille til standard database?')) {
                rickrollDatabase = [...DEFAULT_DATABASE];
                showNotification('Standard database gjenopprettet!', 'warning');
                updateUI();
            }
        }

        // ============================================
        // INIT
        // ============================================
        function init() {
            // Mode selector
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => setMode(btn.dataset.mode));
            });
            
            // Buttons
            elements.checkBtn.addEventListener('click', performCheck);
            elements.testBtn.addEventListener('click', testRandomRickroll);
            elements.clearBtn.addEventListener('click', clearHistory);
            elements.checkTextBtn.addEventListener('click', performTextCheck);
            elements.clearTextBtn.addEventListener('click', () => {
                elements.textInput.value = '';
                elements.textResultBox.style.display = 'none';
            });
            
            // Enter
            elements.urlInput.addEventListener('keypress', e => e.key === 'Enter' && performCheck());
            elements.textInput.addEventListener('keypress', e => {
                if (e.ctrlKey && e.key === 'Enter') performTextCheck();
            });
            
            updateUI();
            showNotification('Rickroll Shield klar!', 'success');
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
